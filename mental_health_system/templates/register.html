<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Mental Health Support</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <h2>Create account.</h2>
    <p class="subtitle">Your information is kept confidential.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-list" style="margin-bottom:16px">
          {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Your name" required autofocus>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Age</label>
          <input type="number" name="age" class="form-control" placeholder="Age" min="10" max="100">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select name="gender" class="form-control">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Non-binary</option>
            <option>Prefer not to say</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" name="contact" class="form-control" placeholder="Phone">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" name="location" class="form-control" placeholder="City">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:6px">
        Create Account →
      </button>
    </form>

    <div class="divider"></div>
    <p class="text-muted" style="text-align:center">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>
</body>
</html>
